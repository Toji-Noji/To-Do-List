<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="00.css">
</head>
<body>
    <header>
        <h1 id="title">My to do list...</h1>
        <p class="date" id="date"></p>
    </header>
    
    <form class="list" id="addform">
        <input type="text"
            id="addtasks"
            placeholder="What to do today..?">    
        <button type="submit" label="Add a task" class="press"> + </button>        
    </form>
    <nav class="filter" id="filetr">
        <button class="filters" data-filter="all">All</button>
        <button class="filters" data-filter="active">Active</button>
        <button class="filters" data-filter="done">Done</button>
    </nav>
    <ul class="taskList" id="taskList"></ul>
    <p class="empty" id="empty">No tasks yet.</p>
    <footer>
        <span id="count">Zero tasks left.</span>
        <button id="clear">Clear</button>
    </footer>
    <script src="00.js"></script>
</body>
</html>
